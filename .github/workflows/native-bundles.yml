name: Native bundles
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Assemble native bundle
        run: npm run native:assemble -- --target '${{ matrix.target }}' '${{ runner.temp }}/native-artifacts'
      - name: Exercise installed and relocated bundle
        run: node distribution/check-native.mjs '${{ runner.temp }}/native-artifacts'
      - uses: actions/upload-artifact@v4
        with:
          name: intent-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-artifacts/*.tar.gz
            ${{ runner.temp }}/native-artifacts/*.sha256
            ${{ runner.temp }}/native-artifacts/artifacts.json
